<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <link rel="apple-touch-icon" href="../apple-touch-icon.png">
  <title>Fretboard Trainer</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <header class="app-header">
      <a class="back-link" href="../">&larr; Tools</a>
      <span class="app-title">Fretboard Trainer</span>
    </header>

    <div class="mode-toggle" role="tablist">
      <button class="mode-btn active" id="tab-drill" role="tab" aria-selected="true" aria-controls="drill-view">Drill</button>
      <button class="mode-btn" id="tab-reference" role="tab" aria-selected="false" aria-controls="reference-view">Reference</button>
    </div>

    <main class="views">
      <section id="drill-view" class="view" role="tabpanel" aria-labelledby="tab-drill"></section>
      <section id="reference-view" class="view" role="tabpanel" aria-labelledby="tab-reference" hidden></section>
    </main>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
