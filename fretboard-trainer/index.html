<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <link rel="apple-touch-icon" href="../apple-touch-icon.png">
  <title>Fretboard Trainer</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <header class="app-header">
      <a class="back-link" href="../">&larr; Tools</a>
      <span class="app-title">Fretboard Trainer</span>
    </header>

    <div class="mode-toggle" role="tablist">
      <button class="mode-btn active" id="tab-drill" role="tab" aria-selected="true" aria-controls="drill-view">Drill</button>
      <button class="mode-btn" id="tab-reference" role="tab" aria-selected="false" aria-controls="reference-view">Reference</button>
    </div>

    <div class="settings-box">
      <button class="expander-btn" id="settings-expander-btn" aria-expanded="false" aria-controls="settings-expander-body">
        <span>Settings</span>
        <span class="expander-icon" aria-hidden="true">&rsaquo;</span>
      </button>
      <div class="expander-body" id="settings-expander-body" hidden>
        <label class="control-row" for="tuning-select">
          <span class="control-label">Tuning</span>
          <select class="control-select" id="tuning-select"></select>
        </label>
        <label class="control-row" for="accidentals-toggle">
          <span class="control-label">Sharps/flats</span>
          <input type="checkbox" id="accidentals-toggle">
        </label>
        <div class="control-row">
          <button type="button" class="tap-btn danger" id="reset-progress-btn">Reset progress</button>
        </div>
      </div>
    </div>

    <main class="views">
      <section id="drill-view" class="view" role="tabpanel" aria-labelledby="tab-drill"></section>
      <section id="reference-view" class="view" role="tabpanel" aria-labelledby="tab-reference" hidden></section>
    </main>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
